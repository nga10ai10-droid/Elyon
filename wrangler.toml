name = "elyon-store"
main = "./worker/index.ts"
compatibility_date = "2026-09-23"
compatibility_flags = ["nodejs_compat"]
# No borrar variables creadas desde el panel de Cloudflare al desplegar.
keep_vars = true

[assets]
binding = "ASSETS"

[images]
binding = "IMAGES"

[[d1_databases]]
binding = "DB"
database_name = "elyon-db"
database_id = "2620c34d-9aa3-40de-bffb-c2470479350a"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "elyon-images"

[vars]
EMAIL_FROM = "ELYON <hola@elyonwear.com>"
SUPPORT_EMAIL = "elyonwearspain@gmail.com"
